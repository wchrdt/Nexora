[package]
name = "nexora"
version = "1.9.24"
description = "Nexora"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
sysinfo = "0.32"
arboard = "3"

# для ExecuteScript в окне музыки (те же версии, что тянет wry/tauri)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# меньше места на диске при RUN_DEV.bat (без отладочной информации)
[profile.dev]
debug = 0
incremental = false
